name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Code formatting and linting (ruff)
        run: uv run ruff check .

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run pip-audit

      - name: Database migration check
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run automated test suite
        run: uv run pytest --cov=app --cov-report=term-missing

      - name: Set up Node for localization regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser scripts and localization security
        run: |
          node --check app/static/app.js
          node --check app/static/review.js
          node --check app/static/i18n.js
          node --check app/static/analytics.js
          node --check app/static/public.js
          node --test tests/i18n.test.cjs

      - name: Install test browser
        run: uv run playwright install --with-deps chromium

      - name: Verify all languages in a real browser with isolated data
        run: uv run python -m scripts.check_i18n_browser

      - name: Verify public SEO and analytics consent/privacy
        run: uv run python -m scripts.check_seo_browser
