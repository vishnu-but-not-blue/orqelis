[project]
name = "orqelis"
version = "0.1.0"
description = "Evidence-first EU procurement decisions"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "jinja2>=3.1.6,<4", "python-multipart>=0.0.22", "defusedxml>=0.7,<1", "pypdf>=6,<7", "itsdangerous>=2.2,<3", "cryptography>=50.0.0,<51"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "pip-audit>=2.8,<3", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=var/pytest_temp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
